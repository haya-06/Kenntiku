<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARCHITECTURE MANIA! REAL BUILD</title>
<style>
:root{--ink:#102238;--blue:#0c3f78;--gold:#ffc928;--red:#ef4a31}
*{box-sizing:border-box}
html,body{margin:0;background:#071522;color:white;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overflow:hidden}
body{touch-action:none}
#app{height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#4e88bd,#071522 72%)}
#game{position:relative;width:min(100vw,177.78dvh);height:min(100dvh,56.25vw);overflow:hidden;background:#9ed4f3;border:3px solid #19334e;box-shadow:0 0 0 5px #e8bd50,0 18px 70px #0008}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:absolute;left:1.2%;right:1.2%;top:1.2%;display:flex;gap:8px;justify-content:space-between;pointer-events:auto;font-weight:900;text-shadow:0 2px 2px #0008}
.pill{background:linear-gradient(#173b61,#0b2038);border:2px solid #e6c15a;border-radius:10px;padding:7px 12px;min-width:110px;box-shadow:0 3px 0 #0005}
.pill small{display:block;font-size:10px;color:#b9d8ef}.pill b{font-size:23px;color:#ffe36a}
#stageName{min-width:220px;text-align:center}
#message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto}
#message .panel{pointer-events:auto;position:relative;z-index:10;background:#09243ddd;border:3px solid #f4ce62;border-radius:18px;padding:22px 34px;text-align:center;box-shadow:0 10px 30px #0008}
#message h1{margin:0 0 8px;font-size:clamp(24px,4vw,58px);color:#ffe06a;text-shadow:3px 3px #13283e}
#message p{margin:5px 0;font-size:clamp(13px,1.5vw,22px)}
button{position:relative;z-index:20;pointer-events:auto;border:0;border-radius:12px;padding:13px 28px;margin:8px;font-size:18px;font-weight:900;cursor:pointer;color:#14263b;background:linear-gradient(#ffe36c,#edaa1b);box-shadow:0 4px 0 #9b6411}
button.secondary{background:linear-gradient(#62b5ff,#2364bc);color:white}
.hidden{display:none!important}
#hint{position:absolute;bottom:1.5%;left:50%;transform:translateX(-50%);background:#071b2ccc;border:1px solid #ffffff55;border-radius:999px;padding:6px 15px;font-size:12px;pointer-events:auto}
@media(max-width:650px){.pill{min-width:70px;padding:4px 6px}.pill b{font-size:16px}.pill small{font-size:8px}#stageName{min-width:90px}.hint{font-size:10px}}
</style>
</head>
<body>
<div id="app">
<div id="game">
<canvas id="cv" width="1280" height="720"></canvas>
<div class="hud">
  <div class="pill"><small>のこり時間</small><b id="time">12.0</b><small>SEC</small></div>
  <div class="pill" id="stageName"><small>STAGE</small><b id="stage">1 / 4</b></div>
  <div class="pill"><small>スコア</small><b id="score">00000</b></div>
  <div class="pill"><small>建築進行</small><b id="build">0%</b></div><div class="pill"><small>コントローラー</small><b id="pad">未接続</b></div>
</div>
<div id="message">
  <div class="panel">
    <h1 id="title">ARCHITECTURE MANIA!</h1>
    <p id="desc">動く的を狙って、未来の家を完成させよう！</p>
    <button id="start">ゲームスタート</button>
    <button class="secondary" id="how">あそびかた</button>
  </div>
</div>
<div id="hint">クリック / タップで発射　｜　Joy-Con：スティックで照準・A/Bボタンで発射</div>
</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const $=id=>document.getElementById(id);
const stages=[
 {name:'基礎工事ステージ',sub:'正しい場所を狙って、基礎をつくろう！',sky:'#8ec8ed',ground:'#a7774e',rate:520,speed:1.0,goal:12},
 {name:'柱・梁ステージ',sub:'柱や梁を狙って、建物を組み上げよう！',sky:'#76b6df',ground:'#a67b55',rate:450,speed:1.25,goal:15},
 {name:'内装ステージ',sub:'家具や照明を狙って、部屋をコーディネート！',sky:'#d6b58b',ground:'#8d6c52',rate:390,speed:1.55,goal:17},
 {name:'建築現場ハチャメチャステージ',sub:'動きの速い的を狙って高得点を目指せ！',sky:'#72b2dc',ground:'#75634e',rate:300,speed:1.9,goal:20}
];
let running=false,stageIndex=0,score=0,stageScore=0,timeLeft=12,targets=[],particles=[],last=0,spawnClock=0,shots=0,hits=0,build=0,mouse={x:W/2,y:H/2},stageEnd=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resizePointer(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H}
cv.addEventListener('pointermove',resizePointer);
cv.addEventListener('pointerdown',e=>{if(!running)return;resizePointer(e);shoot()});
$('start').onclick=()=>{startGame()};
$('how').onclick=()=>{ $('title').textContent='あそびかた';$('desc').innerHTML='的は次々に出現します。赤い中心をクリック／タップ！<br>各ステージ12秒。後半ほど速く、小さくなります。';$('start').textContent='スタート';$('how').classList.add('hidden')};
let activePad=null, padCooldown=0, lastPadFire=false;
function pollGamepad(dt){
 const pads=navigator.getGamepads?navigator.getGamepads():[]; activePad=null;
 for(const p of pads){if(p){activePad=p;break}}
 $('pad').textContent=activePad?'接続中':'未接続'; if(!activePad)return;
 const ax=activePad.axes?.[0]||0, ay=activePad.axes?.[1]||0, dead=.18;
 if(Math.abs(ax)>dead)mouse.x=clamp(mouse.x+ax*dt*720,25,W-25);
 if(Math.abs(ay)>dead)mouse.y=clamp(mouse.y+ay*dt*520,145,H-25);
 padCooldown=Math.max(0,padCooldown-dt);
 const b=activePad.buttons||[], fire=!!(b[0]?.pressed||b[1]?.pressed);
 if(fire&&!lastPadFire&&padCooldown<=0){shoot();padCooldown=.16} lastPadFire=fire;
}
window.addEventListener('gamepadconnected',()=>{$('pad').textContent='接続中'});
window.addEventListener('gamepaddisconnected',()=>{$('pad').textContent='未接続';activePad=null});
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const basePollGamepad=pollGamepad;
pollGamepad=function(dt){
 basePollGamepad(dt); const speed=520;
 if(keys['arrowleft']||keys['a'])mouse.x=clamp(mouse.x-speed*dt,25,W-25);
 if(keys['arrowright']||keys['d'])mouse.x=clamp(mouse.x+speed*dt,25,W-25);
 if(keys['arrowup']||keys['w'])mouse.y=clamp(mouse.y-speed*dt,145,H-25);
 if(keys['arrowdown']||keys['s'])mouse.y=clamp(mouse.y+speed*dt,145,H-25);
 if(keys[' ']&&padCooldown<=0){shoot();padCooldown=.16}
};

function startGame(){stageIndex=0;score=0;build=0;startStage();$('message').classList.add('hidden')}
function startStage(){running=true;stageScore=0;timeLeft=12;targets=[];particles=[];spawnClock=0;shots=0;hits=0;stageEnd=false;last=performance.now();$('stage').textContent=(stageIndex+1)+' / 4';$('stageName').querySelector('small').textContent=stages[stageIndex].name;$('time').textContent='12.0';$('score').textContent=String(score).padStart(5,'0');$('build').textContent=build+'%';requestAnimationFrame(loop)}
function makeTarget(){const s=stages[stageIndex];let type=Math.random();let r=type<.22?22:rand(25,38);if(stageIndex>=2)r*=rand(.7,1);let side=Math.floor(rand(0,4));let x,y,vx,vy;
 if(side===0){x=rand(60,W-60);y=rand(145,220);vx=rand(-.8,.8)*s.speed;vy=rand(.5,1.2)*s.speed}
 if(side===1){x=rand(60,W-60);y=rand(450,650);vx=rand(-.8,.8)*s.speed;vy=-rand(.5,1.2)*s.speed}
 if(side===2){x=rand(45,180);y=rand(210,590);vx=rand(.8,1.7)*s.speed;vy=rand(-.6,.6)*s.speed}
 if(side===3){x=rand(W-180,W-45);y=rand(210,590);vx=-rand(.8,1.7)*s.speed;vy=rand(-.6,.6)*s.speed}
 targets.push({x,y,vx,vy,r,life:rand(2.0,3.4),age:0,phase:rand(0,6.28),value:Math.round(60+(42-r)*2+(stageIndex*25)),kind:Math.floor(rand(0,4))})}
function shoot(){shots++;for(let i=targets.length-1;i>=0;i--){let t=targets[i],d=Math.hypot(mouse.x-t.x,mouse.y-t.y);if(d<t.r*1.15){hits++;score+=t.value;stageScore+=t.value;build=clamp(Math.floor(score/35),0,100);burst(t.x,t.y);targets.splice(i,1);return}}burst(mouse.x,mouse.y,true)}
function burst(x,y,miss=false){for(let i=0;i<(miss?5:16);i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:rand(.25,.6),c:miss?'#cfe9ff':'#ffe06a',size:rand(2,5)})}
function update(dt){pollGamepad(dt);const s=stages[stageIndex];timeLeft-=dt;spawnClock+=dt*1000;
 let interval=s.rate*(stageIndex===3?rand(.7,1):1);
 if(spawnClock>interval){spawnClock=0;makeTarget();if(Math.random()<.24+stageIndex*.07)makeTarget()}
 for(let i=targets.length-1;i>=0;i--){let t=targets[i];t.age+=dt;t.x+=t.vx*dt*60;t.y+=t.vy*dt*60;t.phase+=dt*4;
  if(t.x<30||t.x>W-30)t.vx*=-1;if(t.y<150||t.y>H-40)t.vy*=-1;
  if(t.age>t.life){targets.splice(i,1)}
 }
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.06;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 if(timeLeft<=0)finishStage();
}
function drawBackground(){const s=stages[stageIndex];let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,s.sky);g.addColorStop(.64,'#c8e1e9');g.addColorStop(1,'#6e8190');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant skyline
 ctx.fillStyle='#537a91';for(let x=0;x<W;x+=rand(55,95)){let h=rand(55,160);ctx.fillRect(x,280-h,rand(35,75),h)}
 ctx.fillStyle='#d7b57a';ctx.beginPath();ctx.moveTo(0,520);ctx.lineTo(W*.2,440);ctx.lineTo(W*.42,510);ctx.lineTo(W*.63,420);ctx.lineTo(W,500);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // ground
 ctx.fillStyle=s.ground;ctx.fillRect(0,520,W,200);
 ctx.strokeStyle='#5b493d';ctx.lineWidth=2;for(let y=540;y<720;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+rand(-8,8));ctx.stroke()}
 // cranes
 ctx.strokeStyle='#8b5d35';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(110,520);ctx.lineTo(110,90);ctx.lineTo(460,90);ctx.moveTo(280,90);ctx.lineTo(280,40);ctx.stroke();
 ctx.strokeStyle='#e6b33b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(110,120);ctx.lineTo(460,120);ctx.lineTo(420,160);ctx.stroke();
 // central construction frame evolves
 const p=(stageIndex+1)/4;
 ctx.strokeStyle='#6c482f';ctx.lineWidth=18;ctx.beginPath();
 ctx.moveTo(300,520);ctx.lineTo(300,330);ctx.lineTo(980,330);ctx.lineTo(980,520);
 if(stageIndex>=1){ctx.moveTo(300,330);ctx.lineTo(640,180);ctx.lineTo(980,330);ctx.moveTo(640,180);ctx.lineTo(640,520)}
 if(stageIndex>=2){ctx.lineWidth=9;ctx.moveTo(340,390);ctx.lineTo(940,390);ctx.moveTo(450,330);ctx.lineTo(450,520);ctx.moveTo(820,330);ctx.lineTo(820,520)}
 ctx.stroke();
 if(stageIndex===2){ctx.fillStyle='#ead7bd';ctx.fillRect(330,350,600,170);ctx.fillStyle='#6b9bb6';ctx.fillRect(520,385,115,100);ctx.fillRect(700,385,115,100);ctx.fillStyle='#d5ad6d';ctx.fillRect(360,430,100,70);ctx.fillRect(835,430,65,70)}
 if(stageIndex===3){ctx.fillStyle='#f0c74b';ctx.fillRect(0,570,160,35);ctx.fillStyle='#394f5b';ctx.fillRect(35,535,90,35);ctx.fillStyle='#d5d8d9';ctx.fillRect(1040,570,180,20);ctx.fillStyle='#b65b39';ctx.fillRect(1080,540,90,30)}
 // vignette
 const v=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,700);v.addColorStop(0,'#0000');v.addColorStop(1,'#06132155');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function drawTarget(t){let pulse=1+Math.sin(t.phase)*.08, r=t.r*pulse;ctx.save();ctx.translate(t.x,t.y);
 ctx.shadowColor='#0008';ctx.shadowBlur=12;ctx.shadowOffsetY=5;
 ctx.fillStyle='#f8f8ed';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 ctx.shadowColor='transparent';ctx.lineWidth=Math.max(3,r*.12);ctx.strokeStyle='#bd2b1d';ctx.stroke();
 ctx.fillStyle='#ef4630';ctx.beginPath();ctx.arc(0,0,r*.57,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff9e9';ctx.beginPath();ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#b81f19';ctx.beginPath();ctx.arc(0,0,r*.12,0,Math.PI*2);ctx.fill();
 // tiny depth shadow and label
 ctx.fillStyle='#162a3a';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('+'+t.value,0,r+19);
 ctx.restore();
}
function draw(){drawBackground();targets.forEach(drawTarget);
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
 // blaster
 ctx.save();ctx.translate(mouse.x,mouse.y);ctx.strokeStyle='#69ffb1';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.moveTo(-34,0);ctx.lineTo(-10,0);ctx.moveTo(10,0);ctx.lineTo(34,0);ctx.moveTo(0,-34);ctx.lineTo(0,-10);ctx.moveTo(0,10);ctx.lineTo(0,34);ctx.stroke();ctx.fillStyle='#69ffb1';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore();
 $('time').textContent=Math.max(0,timeLeft).toFixed(1);$('score').textContent=String(score).padStart(5,'0');$('build').textContent=build+'%';
}
function finishStage(){if(stageEnd)return;stageEnd=true;running=false;build=clamp(build+Math.floor(stageScore/120),0,100);
 if(stageIndex<3){stageIndex++;$('title').textContent='STAGE CLEAR!';$('desc').innerHTML=stages[stageIndex-1].name+'<br>今回の得点：'+stageScore+'点';$('start').textContent='次のステージへ';$('start').classList.remove('hidden');$('how').classList.add('hidden');$('message').classList.remove('hidden');$('start').onclick=()=>{startStage();$('message').classList.add('hidden')}}else{showResult()}}
function showResult(){ $('title').textContent='あなたの家が完成しました！';$('desc').innerHTML='総合スコア：<b style="color:#ffe06a;font-size:30px">'+score+'点</b><br>基礎・構造・内装・デザインを攻略！';$('start').textContent='もう一度あそぶ';$('start').classList.remove('hidden');$('how').classList.add('hidden');$('message').classList.remove('hidden');$('start').onclick=()=>{startGame()}}
function loop(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
draw();
</script>
</body>
</html>
